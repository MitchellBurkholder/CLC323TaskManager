name: CST-323 Maven Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CLC-323-App/demo

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: clc323_task_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/clc323_task_manager
      DB_USERNAME: root
      DB_PASSWORD: testpassword

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: CLC-323-App/demo/pom.xml

      - name: Build and test application
        run: mvn --batch-mode clean verify

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: CLC323TaskManager-JAR
          path: CLC-323-App/demo/target/*.jar
          if-no-files-found: error
