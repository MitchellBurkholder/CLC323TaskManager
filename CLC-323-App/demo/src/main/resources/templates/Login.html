<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <!-- Makes the page responsive on phones and tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Sign In | Cloud Task Manager</title>

    <!-- Bootstrap provides responsive layout and form styling. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom application styles. -->
    <link rel="stylesheet" th:href="@{/navbar.css}" />
    <link rel="stylesheet" th:href="@{/basic.css}" />
  </head>

  <body>
    <!-- Displays the shared navigation menu. -->
    <div th:replace="~{fragments/Navbar :: navbar('login')}"></div>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <section class="card auth-card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
              <!-- Login page heading. -->
              <div class="text-center mb-4">
                <div class="feature-number mx-auto mb-3" aria-hidden="true">
                  &#10003;
                </div>

                <p class="hero-eyebrow mb-2">Welcome back</p>

                <h1 class="h2 fw-bold mb-2">Sign In</h1>

                <p class="text-secondary mb-0">
                  Enter your account information to continue.
                </p>
              </div>

              <!-- Displays when the username or password is incorrect. -->
              <div
                class="alert alert-danger"
                role="alert"
                th:if="${param.error}"
              >
                <strong>Login unsuccessful.</strong>
                Check your email address and password.
              </div>

              <!-- Displays after the user successfully signs out. -->
              <div
                class="alert alert-success"
                role="alert"
                th:if="${param.logout}"
              >
                You have been signed out successfully.
              </div>

              <!--
                        Spring Security automatically processes this form.
                        Do not add registrationModel or th:field attributes.
                    -->
              <form th:action="@{/login}" method="post">
                <div class="mb-3">
                  <label class="form-label" for="username">
                    Email Address
                  </label>

                  <!--
                                Spring Security requires this input to use
                                the name "username".
                            -->
                  <input
                    class="form-control form-control-lg"
                    id="username"
                    name="username"
                    type="email"
                    autocomplete="username"
                    placeholder="name@example.com"
                    required
                    autofocus
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label" for="password"> Password </label>

                  <!--
                                Spring Security requires this input to use
                                the name "password".
                            -->
                  <input
                    class="form-control form-control-lg"
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                  />
                </div>

                <!-- Submits the credentials to Spring Security. -->
                <button class="btn btn-primary btn-lg w-100" type="submit">
                  Sign In
                </button>
              </form>

              <div class="text-center mt-4">
                <p class="text-secondary mb-0">
                  Do not have an account?

                  <a
                    class="fw-semibold text-decoration-none"
                    th:href="@{/register/}"
                  >
                    Create an account
                  </a>
                </p>
              </div>
            </div>
          </section>

          <p class="page-footer text-center mt-4 mb-0">Cloud Task Manager</p>
        </div>
      </div>
    </main>

    <!-- Bootstrap JavaScript supports the responsive navbar. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
