<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Create Account | Cloud Task Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/navbar.css}" />
    <link rel="stylesheet" th:href="@{/basic.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/Navbar :: navbar('register')}"></div>

    <main class="container d-flex justify-content-center py-5">
      <section class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <p class="hero-eyebrow mb-2">Join your team</p>

            <h1 class="h2 fw-bold mb-2">Create an Account</h1>

            <p class="text-secondary mb-0">
              Complete the form to access Cloud Task Manager.
            </p>
          </div>

          <form
            th:action="@{/register/doRegistration}"
            th:object="${registrationModel}"
            method="post"
          >
            <input id="createdAt" type="hidden" th:field="*{createdAt}" />

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="firstName">
                  First Name
                  <span class="required-marker">*</span>
                </label>

                <input
                  class="form-control"
                  id="firstName"
                  type="text"
                  autocomplete="given-name"
                  maxlength="50"
                  required
                  th:field="*{firstName}"
                  th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                />

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('firstName')}"
                  th:errors="*{firstName}"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="lastName">
                  Last Name
                  <span class="required-marker">*</span>
                </label>

                <input
                  class="form-control"
                  id="lastName"
                  type="text"
                  autocomplete="family-name"
                  maxlength="50"
                  required
                  th:field="*{lastName}"
                  th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                />

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('lastName')}"
                  th:errors="*{lastName}"
                ></div>
              </div>

              <div class="col-12">
                <label class="form-label" for="email">
                  Email Address
                  <span class="required-marker">*</span>
                </label>

                <input
                  class="form-control"
                  id="email"
                  type="email"
                  autocomplete="email"
                  maxlength="120"
                  placeholder="name@example.com"
                  required
                  th:field="*{email}"
                  th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                />

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('email')}"
                  th:errors="*{email}"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="role">
                  Role
                  <span class="required-marker">*</span>
                </label>

                <select
                  class="form-select"
                  id="role"
                  required
                  th:field="*{role}"
                  th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'"
                >
                  <option value="">Choose a role</option>

                  <option value="USER">Team Member</option>

                  <option value="PROJECT_MANAGER">Project Manager</option>
                </select>

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('role')}"
                  th:errors="*{role}"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="password">
                  Password
                  <span class="required-marker">*</span>
                </label>

                <input
                  class="form-control"
                  id="password"
                  type="password"
                  autocomplete="new-password"
                  maxlength="32"
                  required
                  th:field="*{password}"
                  th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                />

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('password')}"
                  th:errors="*{password}"
                ></div>
              </div>
            </div>

            <div class="d-grid d-sm-flex gap-2 mt-4">
              <button class="btn btn-primary btn-lg flex-grow-1" type="submit">
                Create Account
              </button>

              <a class="btn btn-outline-secondary btn-lg" th:href="@{/login}">
                Cancel
              </a>
            </div>
          </form>

          <p class="text-center text-secondary mt-4 mb-0">
            Already registered?

            <a class="fw-semibold" th:href="@{/login}"> Sign in </a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const createdAt = document.getElementById("createdAt");

      if (createdAt && !createdAt.value) {
        createdAt.value = new Date().toISOString().slice(0, 19);
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
