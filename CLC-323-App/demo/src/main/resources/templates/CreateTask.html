<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Create Task | Cloud Task Manager</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/navbar.css}" />
    <link rel="stylesheet" th:href="@{/basic.css}" />
  </head>

  <body>
    <div th:replace="~{fragments/Navbar :: navbar('create-task')}"></div>

    <main class="container d-flex justify-content-center py-5">
      <section class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="mb-4">
            <p class="hero-eyebrow mb-2">New task</p>

            <h1 class="h2 fw-bold mb-2">Create Task</h1>

            <p class="text-secondary mb-0">
              Enter the task details, priority, and deadline.
            </p>
          </div>

          <form
            th:action="@{/Tasks/doAddTask}"
            th:object="${taskModel}"
            method="post"
          >
            <div class="mb-3">
              <label class="form-label" for="title">
                Title
                <span class="required-marker">*</span>
              </label>

              <input
                class="form-control"
                id="title"
                type="text"
                maxlength="20"
                required
                th:field="*{title}"
                th:classappend="${#fields.hasErrors('title')}
                                        ? 'is-invalid'"
              />

              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('title')}"
                th:errors="*{title}"
              ></div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="fullName">
                Full Name
                <span class="required-marker">*</span>
              </label>

              <input
                      class="form-control"
                      id="fullName"
                      type="text"
                      maxlength="100"
                      required
                      th:field="*{fullName}"
                      th:classappend="${#fields.hasErrors('fullName')}
                                        ? 'is-invalid'"
              />

              <div
                      class="invalid-feedback"
                      th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}"
              ></div>
            </div>


            <div class="mb-3">
              <label class="form-label" for="description">
                Description
                <span class="required-marker">*</span>
              </label>

              <textarea
                class="form-control"
                id="description"
                rows="5"
                required
                th:field="*{description}"
                th:classappend="${#fields.hasErrors('description')}
                                        ? 'is-invalid'"
              ></textarea>

              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('description')}"
                th:errors="*{description}"
              ></div>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="priority">
                  Priority
                  <span class="required-marker">*</span>
                </label>

                <select
                  class="form-select"
                  id="priority"
                  required
                  th:field="*{priority}"
                  th:classappend="${#fields.hasErrors('priority')}
                                            ? 'is-invalid'"
                >
                  <option value="">Choose a priority</option>

                  <option value="Low">Low</option>

                  <option value="Medium">Medium</option>

                  <option value="High">High</option>
                </select>

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('priority')}"
                  th:errors="*{priority}"
                ></div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="dueDate">
                  Due Date
                  <span class="required-marker">*</span>
                </label>

                <input
                  class="form-control"
                  id="dueDate"
                  type="datetime-local"
                  required
                  th:field="*{dueDate}"
                  th:classappend="${#fields.hasErrors('dueDate')}
                                            ? 'is-invalid'"
                />

                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('dueDate')}"
                  th:errors="*{dueDate}"
                ></div>
              </div>
            </div>

            <div class="d-grid d-sm-flex gap-2 mt-4">
              <button class="btn btn-primary btn-lg" type="submit">
                Create Task
              </button>

              <a class="btn btn-outline-secondary btn-lg" th:href="@{/tasks}">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
